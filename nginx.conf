# 1. Main Global Context
worker_processes auto;
pid /var/run/nginx.pid;

# 2. Events Architecture Block
events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

# 3. HTTP Gateway & Routing Engine Block
http {
  # MIME Type Resolutions
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # High-Performance I/O & TCP Tuning
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;

  # Security Hardening: Suppress Nginx Version
  server_tokens off;

  # Virtual Server Definition
  server {
    listen 80;
    server_name _;

    # Maximum payload size (blocks large memory-exhaustion payloads)
    client_max_body_size 10M;

    # Dynamic API Reverse Proxy
    location /api/ {
      proxy_pass http://api:8000;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }

    # Healthcheck Passthrough
    location /healthz {
      proxy_pass http://api:8000/healthz;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    # Static Frontend Delivery & SPA Route Fallback
    location / {
      root /usr/share/nginx/html;
      index index.html index.htm;
      try_files $uri $uri/ /index.html;
    }
  }
}
