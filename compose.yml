services:
  db:
    image: postgres:15.3-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${DB_NAME:-appliance_prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal_net
    healthcheck:  
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${DB_NAME:-appliance_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    image: appliance-api:local
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-appliance_prod} 
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    networks: 
      - internal_net

  web:
    build:
      context: ./services/web
      dockerfile: Dockerfile
    image: appliance-web:local
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - internal_net

volumes:
  postgres_data:

networks:
  internal_net:
    driver: bridge


